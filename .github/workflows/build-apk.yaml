name: Build Android APK
run-name: ${{ github.event.inputs.repository }} ${{ github.event.inputs.branchName && format('{0}', github.event.inputs.branchName) }} ${{ github.event.inputs.subdir && format('[/{0}]', github.event.inputs.subdir) }} :${{ github.event.inputs.taskName }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/android/sunflower"
      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""
      subdir:
        description: "Relative subdirectory path when the project is nested [Optional]"
        required: false
        default: ""
      jdkVersion:
        description: "OpenJDK version: 8, 17, 21, 25, …"
        required: false
        default: "17"
      taskName:
        description: "build.gradle task name: assembleDebug, assembleRelease, etc."
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ github.event.inputs.jdkVersion }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"

      - name: Clone project
        shell: bash
        run: |
          if [[ -z "${{ github.event.inputs.branchName }}" ]]; then
            git clone --recurse-submodules --depth=1 \
              "${{ github.event.inputs.repository }}" \
              workspace
          else
            git clone --recurse-submodules --depth=1 \
              --branch "${{ github.event.inputs.branchName }}" \
              "${{ github.event.inputs.repository }}" \
              workspace
          fi

      - name: Summarize build inputs
        shell: bash
        run: |
          REPO='${{ github.event.inputs.repository }}'
          BRANCH='${{ github.event.inputs.branchName }}'
          SUBDIR='${{ github.event.inputs.subdir }}'
          JDK='${{ github.event.inputs.jdkVersion }}'
          TASK='${{ github.event.inputs.taskName }}'

          if [ -z "$BRANCH" ]; then
            BRANCH=$(git -C workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo "default")
          fi

          if [ -z "$SUBDIR" ]; then
            SUBDIR_DISPLAY="_project root_"
          else
            SUBDIR_DISPLAY="\`$SUBDIR\`"
          fi

          {
            echo "## :clipboard: Build Inputs"
            echo ""
            echo "- **repository:** [$REPO]($REPO)"
            echo "- **branchName:** \`$BRANCH\`"
            echo "- **subdir:** $SUBDIR_DISPLAY"
            echo "- **jdkVersion:** \`$JDK\`"
            echo "- **taskName:** \`$TASK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        working-directory: ./workspace/${{ github.event.inputs.subdir }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Preparing Gradle"
          echo "========================================"

          if [[ ! -f "gradlew" ]]; then
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.2.1 wrapper..."
            gradle wrapper --gradle-version 8.2.1
          else
            echo "Gradle wrapper found. Using the project's wrapper."
          fi

          chmod +x gradlew

          echo ""
          echo "========================================"
          echo "Gradle version"
          echo "========================================"

          ./gradlew --version

          echo ""
          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found."
          else
            echo "::warning::sdkmanager was not found in PATH."
          fi

          LOG_FILE="$(mktemp)"

          handle_failure() {
            {
              echo "## :x: Gradle Build Failed — \`${{ github.event.inputs.taskName }}\`"
              echo ""
              echo "### Complete Gradle output"
              echo ""
              echo '```text'
              cat "$LOG_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ "${{ github.event.inputs.taskName }}" == *Release* ]]; then

            echo ""
            echo "========================================"
            echo "Preparing debug signing key"
            echo "========================================"

            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              echo "Debug keystore not found. Creating one..."

              mkdir -p "$HOME/.android"

              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "C=US, O=Android, CN=Android Debug"
            else
              echo "Debug keystore already exists."
            fi

            echo ""
            echo "========================================"
            echo "Building RELEASE APK"
            echo "========================================"

            set +e

            ./gradlew "${{ github.event.inputs.taskName }}" \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              2>&1 | tee "$LOG_FILE"

            STATUS=${PIPESTATUS[0]}

            set -e

          else

            echo ""
            echo "========================================"
            echo "Building APK"
            echo "========================================"

            set +e

            ./gradlew "${{ github.event.inputs.taskName }}" \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              2>&1 | tee "$LOG_FILE"

            STATUS=${PIPESTATUS[0]}

            set -e

          fi

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            handle_failure

            exit "$STATUS"
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

      - name: Find generated APKs
        if: success()
        shell: bash
        run: |
          echo "Generated APK files:"
          find workspace -type f -name "*.apk" -print

      - name: Upload the APK artifact with 1 day retention
        if: success()
        uses: actions/upload-artifact@v6
        with:
          path: workspace/**/*.apk
          name: apk-archive
          retention-days: 1
