name: Build Android APK
run-name: ${{ github.event.inputs.repository }} ${{ github.event.inputs.branchName && format('{0}', github.event.inputs.branchName) }} ${{ github.event.inputs.subdir && format('[/{0}]', github.event.inputs.subdir) }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/android/sunflower"
      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""
      subdir:
        description: "Relative subdirectory path when the project is nested [Optional]"
        required: false
        default: ""
      jdkVersion:
        description: "OpenJDK version: 8, 17, 21, 25, …"
        required: false
        default: "17"
      taskName:
        description: "build.gradle task name: assembleDebug, assembleRelease, etc."
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Clone the selected Android project FIRST.
      #    This must happen before setup-java because Gradle
      #    caching needs to see the project's Gradle files.
      # ---------------------------------------------------------
      - name: Clone project
        shell: bash
        run: |
          rm -rf workspace

          if [[ -z "${{ github.event.inputs.branchName }}" ]]; then
            git clone --recurse-submodules --depth=1 \
              "${{ github.event.inputs.repository }}" \
              workspace
          else
            git clone --recurse-submodules --depth=1 \
              --branch "${{ github.event.inputs.branchName }}" \
              "${{ github.event.inputs.repository }}" \
              workspace
          fi

      # ---------------------------------------------------------
      # 2. Setup Java AFTER the project has been cloned.
      # ---------------------------------------------------------
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion }}
          cache: gradle
          cache-dependency-path: |
            workspace/**/*.gradle*
            workspace/**/gradle-wrapper.properties
            workspace/**/gradle/*.versions.toml
            workspace/**/versions.properties

      # ---------------------------------------------------------
      # 3. Setup Android SDK.
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # ---------------------------------------------------------
      # 4. Show the selected build settings.
      # ---------------------------------------------------------
      - name: Summarize build inputs
        shell: bash
        run: |
          REPO='${{ github.event.inputs.repository }}'
          BRANCH='${{ github.event.inputs.branchName }}'
          SUBDIR='${{ github.event.inputs.subdir }}'
          JDK='${{ github.event.inputs.jdkVersion }}'
          TASK='${{ github.event.inputs.taskName }}'

          if [ -z "$BRANCH" ]; then
            BRANCH=$(git -C workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo "default")
          fi

          if [ -z "$SUBDIR" ]; then
            SUBDIR_DISPLAY="_project root_"
          else
            SUBDIR_DISPLAY="\`$SUBDIR\`"
          fi

          {
            echo "## :clipboard: Build Inputs"
            echo ""
            echo "- **repository:** [$REPO]($REPO)"
            echo "- **branchName:** \`$BRANCH\`"
            echo "- **subdir:** $SUBDIR_DISPLAY"
            echo "- **jdkVersion:** \`$JDK\`"
            echo "- **taskName:** \`$TASK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # 5. Build the APK.
      # ---------------------------------------------------------
      - name: Build APK
        working-directory: ./workspace/${{ github.event.inputs.subdir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Gradle"
          echo "========================================"

          GRADLE_VERSION="8.9"

          # If the project has no wrapper, generate a compatibility wrapper.
          # Many Android projects expect AGP + Gradle 8.x, not Gradle 9/10.
          if [[ ! -f "gradlew" ]]; then
            echo "No Gradle wrapper found."
            echo "Creating a compatible Gradle wrapper (Gradle ${GRADLE_VERSION})..."
            gradle wrapper --gradle-version "${GRADLE_VERSION}"
          else
            echo "Gradle wrapper found."
            echo "Checking if the existing wrapper is too new for this project..."
            CURRENT_WRAPPER_VERSION="$(./gradlew -q properties 2>/dev/null | awk '/^version:/{print $2}' || true)"
            if [[ -n "${CURRENT_WRAPPER_VERSION}" ]] && [[ "${CURRENT_WRAPPER_VERSION}" =~ ^9\.|^10\. ]]; then
              echo "Detected a Gradle ${CURRENT_WRAPPER_VERSION} wrapper. Replacing it with Gradle ${GRADLE_VERSION} for compatibility."
              gradle wrapper

