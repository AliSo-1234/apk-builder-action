name: Build Android APK

run-name: Build ${{ github.event.inputs.repository }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/tokenarc/open-jarvis"

      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""

      subdir:
        description: "Relative subdirectory path [Optional]"
        required: false
        default: ""

      jdkVersion:
        description: "JDK version"
        required: false
        default: "17"

      taskName:
        description: "Gradle task"
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        shell: bash
        run: |
          set -e

          git clone --depth=1 \
            "${{ github.event.inputs.repository }}" \
            workspace

          echo "Project cloned."
          ls -la workspace

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Prepare Gradle
        working-directory: workspace
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.2.1"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          echo "Preparing Gradle $GRADLE_VERSION"

          if [ ! -f "$GRADLE_DIR/bin/gradle" ]; then
            curl -fL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$GRADLE_ZIP"

            mkdir -p "$RUNNER_TEMP/gradle-extract"

            unzip -q \
              "$GRADLE_ZIP" \
              -d "$RUNNER_TEMP/gradle-extract"

            rm -rf "$GRADLE_DIR"

            mv \
              "$RUNNER_TEMP/gradle-extract/gradle-${GRADLE_VERSION}" \
              "$GRADLE_DIR"
          fi

          "$GRADLE_DIR/bin/gradle" --version

          if [ ! -f "gradlew" ]; then
            "$GRADLE_DIR/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Configure gradle.properties
        working-directory: workspace
        shell: bash
        run: |
          echo "Creating gradle.properties with AndroidX configuration..."
          cat > gradle.properties << 'EOF'
# AndroidX Configuration
android.useAndroidX=true
android.enableJetifier=true

# Performance optimizations
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
EOF
          echo "gradle.properties created successfully"
          cat gradle.properties

      - name: Build APK
        working-directory: workspace
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "========================================"
          echo "Building Open Jarvis"
          echo "========================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "C=US, O=Android, CN=Android Debug"
          fi

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        if: success()
        working-directory: workspace
        shell: bash
        run: |
          echo "========================================"
          echo "APK files"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: open-jarvis-apk
          path: workspace/**/*.apk
          if-no-files-found: error
          retention-days: 7