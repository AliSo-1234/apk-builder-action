name: Build Android APK
run-name: ${{ github.event.inputs.repository }} ${{ github.event.inputs.branchName && format('{0}', github.event.inputs.branchName) }} ${{ github.event.inputs.subdir && format('[/{0}]', github.event.inputs.subdir) }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/android/sunflower"
      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""
      subdir:
        description: "Relative subdirectory path when the project is nested [Optional]"
        required: false
        default: ""
      jdkVersion:
        description: "OpenJDK version: 8, 17, 21, 25, …"
        required: false
        default: "17"
      taskName:
        description: "build.gradle task name: assembleDebug, assembleRelease, etc."
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Clone the selected Android project FIRST.
      #    This must happen before setup-java because Gradle
      #    caching needs to see the project's Gradle files.
      # ---------------------------------------------------------
      - name: Clone project
        shell: bash
        run: |
          rm -rf workspace

          if [[ -z "${{ github.event.inputs.branchName }}" ]]; then
            git clone --recurse-submodules --depth=1 \
              "${{ github.event.inputs.repository }}" \
              workspace
          else
            git clone --recurse-submodules --depth=1 \
              --branch "${{ github.event.inputs.branchName }}" \
              "${{ github.event.inputs.repository }}" \
              workspace
          fi

      # ---------------------------------------------------------
      # 2. Setup Java AFTER the project has been cloned.
      # ---------------------------------------------------------
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion }}
          cache: gradle
          cache-dependency-path: |
            workspace/**/*.gradle*
            workspace/**/gradle-wrapper.properties
            workspace/**/gradle/*.versions.toml
            workspace/**/versions.properties

      # ---------------------------------------------------------
      # 3. Setup Android SDK.
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # ---------------------------------------------------------
      # 4. Show the selected build settings.
      # ---------------------------------------------------------
      - name: Summarize build inputs
        shell: bash
        run: |
          REPO='${{ github.event.inputs.repository }}'
          BRANCH='${{ github.event.inputs.branchName }}'
          SUBDIR='${{ github.event.inputs.subdir }}'
          JDK='${{ github.event.inputs.jdkVersion }}'
          TASK='${{ github.event.inputs.taskName }}'

          if [ -z "$BRANCH" ]; then
            BRANCH=$(git -C workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo "default")
          fi

          if [ -z "$SUBDIR" ]; then
            SUBDIR_DISPLAY="_project root_"
          else
            SUBDIR_DISPLAY="\`$SUBDIR\`"
          fi

          {
            echo "## :clipboard: Build Inputs"
            echo ""
            echo "- **repository:** [$REPO]($REPO)"
            echo "- **branchName:** \`$BRANCH\`"
            echo "- **subdir:** $SUBDIR_DISPLAY"
            echo "- **jdkVersion:** \`$JDK\`"
            echo "- **taskName:** \`$TASK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # 5. Build the APK.
      # ---------------------------------------------------------
      - name: Build APK
        working-directory: ./workspace/${{ github.event.inputs.subdir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Gradle"
          echo "========================================"

          # If the project does not include its own Gradle wrapper,
          # generate a compatible one. Many Android projects are
          # built with AGP + Gradle 8.x, not Gradle 9.x.
          if [[ ! -f "gradlew" ]]; then
            echo "No Gradle wrapper found."
            echo "Creating a compatible Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          else
            echo "Gradle wrapper found."
            echo "Using the project's existing Gradle wrapper."
          fi

          chmod +x gradlew

          # Android projects usually require local.properties
          # so the SDK path is known to Gradle.
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -n "${ANDROID_SDK_ROOT}" ]]; then
            echo "Writing local.properties for SDK: ${ANDROID_SDK_ROOT}"
            printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT}" > local.properties
          else
            echo "::warning::ANDROID_SDK_ROOT/ANDROID_HOME is not set; local.properties could not be generated."
          fi

          echo ""
          echo "========================================"
          echo "Gradle version"
          echo "========================================"

          ./gradlew --version

          echo ""
          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found."
          else
            echo "::warning::sdkmanager was not found in PATH."
          fi

          # Accept licenses in case additional SDK components
          # are required by the project.
          yes | sdkmanager --licenses > /dev/null || true

          LOG_FILE="$(mktemp)"

          handle_failure() {
            {
              echo "## :x: Gradle Build Failed — \`${{ github.event.inputs.taskName }}\`"
              echo ""
              echo "### Complete Gradle output"
              echo ""
              echo '```text'
              cat "$LOG_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # -----------------------------------------------------
          # Release build
          # -----------------------------------------------------
          if [[ "${{ github.event.inputs.taskName }}" == *Release* ]]; then

            echo ""
            echo "========================================"
            echo "Preparing debug signing key"
            echo "========================================"

            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              echo "Debug keystore not found. Creating one..."

              mkdir -p "$HOME/.android"

              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "C=US, O=Android, CN=Android Debug"
            else
              echo "Debug keystore already exists."
            fi

            echo ""
            echo "========================================"
            echo "Building RELEASE APK"
            echo "========================================"

            set +e

            ./gradlew "${{ github.event.inputs.taskName }}" \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              2>&1 | tee "$LOG_FILE"

            STATUS=${PIPESTATUS[0]}

            set -e

          # -----------------------------------------------------
          # Non-release build
          # -----------------------------------------------------
          else

            echo ""
            echo "========================================"
            echo "Building APK"
            echo "========================================"

            set +e

            ./gradlew "${{ github.event.inputs.taskName }}" \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              2>&1 | tee "$LOG_FILE"

            STATUS=${PIPESTATUS[0]}

            set -e

          fi

          # -----------------------------------------------------
          # Handle failure.
          # -----------------------------------------------------
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            handle_failure

            exit "$STATUS"
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

      # ---------------------------------------------------------
      # 6. Show where the APK was generated.
      # ---------------------------------------------------------
      - name: Find generated APKs
        if: success()
        shell: bash
        run: |
          echo "Generated APK files:"
          find workspace -type f -name "*.apk" -print

      # ---------------------------------------------------------
      # 7. Upload APK.
      # ---------------------------------------------------------
      - name: Upload the APK artifact with 1 day retention
        if: success()
        uses: actions/upload-artifact@v6
        with:
          path: workspace/**/*.apk
          name: apk-archive
          retention-days: 1
